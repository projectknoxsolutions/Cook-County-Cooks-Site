<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee of the Week | Cook County Cooks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #0B1026; color: #E8ECF6;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 2rem; text-align: center;
    }
    .badge {
      font-family: 'Space Grotesk', sans-serif; font-size: .75rem; letter-spacing: .2em;
      text-transform: uppercase; color: #1E8FE0; border: 1px solid #1E8FE066;
      border-radius: 999px; padding: .35rem 1rem; margin-bottom: 1.5rem;
    }
    h1 { font-family: 'Space Grotesk', sans-serif; font-size: clamp(1.6rem, 4vw, 2.4rem); margin-bottom: .75rem; }
    p { color: #9AA6C4; max-width: 34rem; line-height: 1.6; }
    .frame {
      width: 200px; height: 240px; margin-bottom: 1.5rem; border: 6px solid #C9A24B;
      border-radius: 4px; background: linear-gradient(160deg, #141A38, #0E1330);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 12px 30px rgba(0,0,0,.5); font-size: 4rem;
    }
    a.back {
      margin-top: 2rem; color: #1E8FE0; text-decoration: none; font-weight: 500;
      border: 1px solid #1E8FE055; border-radius: 8px; padding: .6rem 1.2rem;
    }
    a.back:hover, a.back:focus-visible { background: #1E8FE01a; outline: 2px solid #1E8FE0; outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="frame" aria-hidden="true">⭐</div>
  <div class="badge">Break Room Wall</div>
  <h1>Employee of the Week</h1>
  <p>The frame is hung and the wall is ready. This week's winner gets announced here — photo, name, and the numbers that earned it.</p>
  <a class="back" href="../../index.html">&larr; Back to the Kitchen</a>
</body>
</html>
